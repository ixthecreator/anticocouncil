name: 线上巡检

on:
  schedule:
    # 每天北京时间 08:17 和 20:17
    - cron: "17 0,12 * * *"
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  smoke:
    name: 检查正式站
    # 部署事件只在生产部署成功后巡检；预览部署不检查正式站。
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 访问关键页面
        id: smoke
        continue-on-error: true
        run: node scripts/check-production.mjs | tee smoke-report.md
        env:
          SITE_URL: https://www.anticocouncil.com
      - name: 更新巡检 Issue
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const title = '线上巡检失败：正式站异常';
            const report = fs.existsSync('smoke-report.md') ? fs.readFileSync('smoke-report.md', 'utf8') : '没有生成报告。';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'uptime', per_page: 10,
            });
            const existing = open.find((issue) => issue.title === title);
            if (process.env.OUTCOME === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number,
                  body: `已恢复正常。\n\n${report}\n\n[巡检记录](${process.env.RUN_URL})` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number,
                  state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const body = `巡检发现正式站异常。\n\n${report}\n\n[巡检记录](${process.env.RUN_URL})`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['uptime'] });
            }
            core.setFailed('正式站巡检未通过');
